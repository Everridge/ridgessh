# Every push to main is a release. The workflow:
#   1. picks the version (scripts/version.mjs next: a patch bump unless the files already have a
#      newer version, or a commit says #minor / #major) and gives CHANGELOG.md its section,
#   2. runs the checks and builds the signed Windows installer,
#   3. commits "Release vX.Y.Z" to main and tags it,
#   4. publishes the installer and latest.json as this repo's GitHub release, where installed
#      apps look for updates and the README's download link points,
#   5. merges main back into staging, so the version commit does not make them drift.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater signature).
#
# Optional Windows code signing (Azure Trusted Signing): repository variables
# AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE and secrets
# AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID. Without them the installer is unsigned.
#
# macOS releases are paused; see git history for the universal-apple-darwin build and its
# signing and notarization steps.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and none is cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Check the signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }

      - name: Choose the version
        id: version
        run: |
          v=$(node scripts/version.mjs next)
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already tagged"
            exit 1
          fi
          node scripts/version.mjs prepare "$v"
          pnpm exec prettier --write CHANGELOG.md
          node scripts/version.mjs notes "$v" > "$RUNNER_TEMP/notes.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "## RidgeSSH $v" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm format:check
      - run: pnpm check

      - name: Set up Windows code signing
        if: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        run: |
          cargo install trusted-signing-cli --locked
          cat > "$RUNNER_TEMP/signing.conf.json" <<JSON
          {"bundle":{"windows":{"signCommand":"trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} -d RidgeSSH %1"}}}
          JSON
          echo "TAURI_EXTRA_ARGS=--config $RUNNER_TEMP/signing.conf.json" >> "$GITHUB_ENV"

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: pnpm tauri build $TAURI_EXTRA_ARGS

      # Pushed before publishing: if main moved on meanwhile this fails, and nothing is released
      # under a version the next run would pick again.
      - name: Commit and tag the version
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$V [skip ci]"
          git tag -a "v$V" -m "RidgeSSH $V"
          git push --atomic origin HEAD:main "v$V"

      - name: Publish the release
        env:
          V: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=src-tauri/target/release/bundle/nsis
          exe="$dir/RidgeSSH_${V}_x64-setup.exe"
          [ -f "$exe" ] && [ -f "$exe.sig" ] || { ls -l "$dir"; exit 1; }
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          node scripts/publish.mjs manifest "$V" "$exe" "$GITHUB_REPOSITORY" > "$out/latest.json"
          cp "$exe" "$out/RidgeSSH-setup.exe"
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --verify-tag --title "RidgeSSH $V" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest \
            "$exe" "$exe.sig" "$out/latest.json" "$out/RidgeSSH-setup.exe"

      - name: Merge main back into staging
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin staging
          git checkout -B staging origin/staging
          if git merge --no-edit -m "Merge v$V into staging [skip ci]" "v$V^{commit}"; then
            git push origin staging
          else
            git merge --abort
            echo "::warning::main could not be merged into staging; merge it by hand"
          fi
