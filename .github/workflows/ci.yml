# Checks every push to staging and every pull request; pushes to staging also build a test
# installer, kept as a workflow artifact for 14 days. Installed apps never see these builds:
# only main is released (release.yml).
name: CI

on:
  push:
    branches: [staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused to keep runs short; add macos-latest back to build it again.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs check
      - run: pnpm format:check
      - run: pnpm check
      # Builds the app bundle (unsigned, no updater artifacts) to catch bundling problems early.
      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Build the Windows installer
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Keep the installer
        if: runner.os == 'Windows' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: RidgeSSH-staging-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
