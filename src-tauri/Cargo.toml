[package]
name = "ridgessh"
version = "0.1.0"
description = "Lightweight SSH connection manager"
authors = ["Everridge"]
edition = "2024"
rust-version = "1.95"

[lib]
# The `_lib` suffix is necessary to keep the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ridgessh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "2.5.0"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
sha2 = "0.11.1"
hex = "0.4.3"
glob = "0.3.4"
portable-pty = "0.9.0"
which = "8.0.6"
tauri-plugin-clipboard-manager = "2"
similar = "3.2.1"
age = { version = "0.12.1", default-features = false }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring = "4.2.0"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# scrypt (backup encryption) is ~30x slower unoptimized; keep debug builds usable.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
