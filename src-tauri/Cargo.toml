[package]
name = "ridgessh"
version = "0.1.0"
description = "Lightweight SSH connection manager"
authors = ["Everridge"]
edition = "2024"
rust-version = "1.95"

[lib]
# The `_lib` suffix is necessary to keep the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ridgessh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.5.0"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
sha2 = "0.11.1"
hex = "0.4.3"
glob = "0.3.4"
portable-pty = "0.9.0"
which = "8.0.6"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
